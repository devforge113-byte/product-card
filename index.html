<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточка товара</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#05070d;
    padding:30px;
    color:#fff;
}

/* SIDEBAR */
.product-sidebar{
    margin: auto;
    width:360px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

/* ОБЩИЕ БЛОКИ */
.product-box{
    background:#0b1020;
    border:1px solid #151d35;
    border-radius:18px;
    padding:22px;
    box-shadow:0 0 15px rgba(0,0,0,.35);
}

/* ЦЕНА */
.price-title{
    color:#9aa3bd;
    font-size:15px;
    margin-bottom:10px;
}

.price{
    font-size:44px;
    font-weight:700;
    color:#2f7cff;
    margin-bottom:15px;
}

.stock{
    display:flex;
    align-items:center;
    gap:10px;
    color:#59d96d;
    font-size:16px;
    margin-bottom:25px;
}

.stock i{
    width:22px;
    height:22px;
    border-radius:50%;
    background:#1c4727;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
}

/* КНОПКИ */
.btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:18px;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
}

.btn-buy{
    background:#2f7cff;
    color:#fff;
    margin-bottom:14px;
}

.btn-buy:hover{
    background:#4a8fff;
}

/* ТЕМНЫЕ КНОПКИ */
.btn-dark{
    background:#111827;
    border:1px solid #1d2945;
    color:#fff;
}

.btn-dark:hover{
    background:#18233d;
}

/* БЕЗОПАСНАЯ ОПЛАТА */
.safe-pay{
    margin-top:22px;
    display:flex;
    gap:12px;
    color:#8c95af;
    font-size:15px;
    line-height:1.5;
}

.safe-pay i{
    color:#a7b3d8;
    margin-top:3px;
}

/* ХАРАКТЕРИСТИКИ */
.features{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.feature-item{
    display:flex;
    justify-content:space-between;
    gap:20px;
    border-bottom:1px solid #141d35;
    padding-bottom:14px;
}

.feature-item:last-child{
    border:none;
    padding-bottom:0;
}

.feature-name{
    color:#8f98b3;
}

.feature-value{
    color:#fff;
    font-weight:600;
    text-align:right;
}

/* ДЕМО */
.demo-btn{
    margin-top:25px;
}

/* АВТОР */
.author{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.author-avatar{
    width:70px;
    height:70px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
}

.author-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.author-info{
    display:flex;
    flex-direction:column;
}

.author-label{
    color:#8f98b3;
    font-size:14px;
    margin-bottom:6px;
    font-weight:500;
}

.author-name{
    font-size:22px;
    font-weight:700;
    margin-bottom:6px;
}

.author-status{
    color:#5bdd6d;
    font-size:15px;
}

/* ПОДЕЛИТЬСЯ */
.share-title{
    font-size:24px;
    font-weight:700;
    margin-bottom:22px;
}

.share-list{
    display:flex;
    gap:14px;
}

.share-btn{
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    color:#fff;
    text-decoration:none;
    transition:.2s;
}

.share-btn:hover{
    transform:translateY(-3px);
}

.telegram{ background:#2AABEE; }
.vk{ background:#2787F5; }
.whatsapp{ background:#25D366; }
.link{ background:#1b2238; }

@media(max-width:480px){
    .product-sidebar{
        width:100%;
    }

    .price{
        font-size:38px;
    }
}
</style>
</head>
<body>

<div class="product-sidebar">

    <!-- 1 БЛОК -->
    <div class="product-box">

        <div class="price-title">Цена:</div>

        <div class="price">1 290 ₽</div>

        <div class="stock">
            <i class="fa-solid fa-check"></i>
            В наличии
        </div>

        <button class="btn btn-buy">
            <i class="fa-solid fa-cart-shopping"></i>
            Купить сейчас
        </button>

        <button class="btn btn-dark">
            <i class="fa-solid fa-basket-shopping"></i>
            В корзину
        </button>

        <div class="safe-pay">
            <i class="fa-solid fa-shield-halved"></i>

            <div>
                Безопасная оплата и моментальная выдача товара после покупки
            </div>
        </div>

    </div>

    <!-- 2 БЛОК -->
    <div class="product-box">

        <div class="features">

            <div class="feature-item">
                <div class="feature-name">
                    Версия DLE:
                </div>

                <div class="feature-value">
                    16.0 и выше
                </div>
            </div>

            <div class="feature-item">
                <div class="feature-name">
                    Тип товара:
                </div>

                <div class="feature-value">
                    Шаблон
                </div>
            </div>

            <div class="feature-item">
                <div class="feature-name">
                    Модульность:
                </div>

                <div class="feature-value">
                    Нет
                </div>
            </div>

            <div class="feature-item">
                <div class="feature-name">
                    Дата добавления:
                </div>

                <div class="feature-value">
                    22.05.2024
                </div>
            </div>

            <div class="feature-item">
                <div class="feature-name">
                    Просмотров:
                </div>

                <div class="feature-value">
                    1 245
                </div>
            </div>

            <div class="feature-item">
                <div class="feature-name">
                    Покупок:
                </div>

                <div class="feature-value">
                    89
                </div>
            </div>

        </div>

        <!-- ЕСЛИ ЕСТЬ ССЫЛКА -->
        <a href="#" class="btn btn-dark demo-btn">
            Демо сайт
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </a>

    </div>

    <!-- АВТОР -->
    <div class="product-box">

        <div class="author">

            <div class="author-avatar">
                <img src="https://i.imgur.com/tX8g6wR.png" alt="">
            </div>

            <div class="author-info">

                <div class="author-label">
                    Автор товара
                </div>

                <div class="author-name">
                    Светлана
                </div>

                <div class="author-status">
                    ● Онлайн
                </div>

            </div>

        </div>

        <button class="btn btn-dark">
            Все товары автора
        </button>

    </div>

    <!-- 3 БЛОК -->
    <div class="product-box">

        <div class="share-title">
            Поделиться товаром
        </div>

        <div class="share-list">

            <a href="#" class="share-btn telegram">
                <i class="fa-brands fa-telegram"></i>
            </a>

            <a href="#" class="share-btn vk">
                <i class="fa-brands fa-vk"></i>
            </a>

            <a href="#" class="share-btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

            <a href="#" class="share-btn link">
                <i class="fa-solid fa-link"></i>
            </a>

        </div>

    </div>

</div>

</body>
</html>
